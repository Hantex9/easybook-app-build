run-name: ${{ github.event.inputs.branch || 'Build and Deploy' }}

on:
  workflow_dispatch:
    inputs:
      branch:
        description: "Branch to build"
        required: true
      forceScreenshots:
        description: "Force screenshots creation"
        required: false
        default: "false"
        type: choice
        options:
          - "true"
          - "false"

jobs:
  build_ios:
    name: Build iOS
    runs-on: macos-latest

    steps:
      - name: Checkout the Private Repository
        uses: actions/checkout@v6
        with:
          repository: Hantex9/easybook-app-refactor
          token: ${{ secrets.EASYBOOK_RELEASE_AUTOMATION_REPO_TOKEN }}
          ref: ${{ github.event.inputs.branch }}

      - name: Save source commit
        run: echo "SOURCE_SHA=$(git rev-parse HEAD)" >> "$GITHUB_ENV"

      - name: Check if lorenzo.txt exists
        run: |
          if [ -f "lorenzo.txt" ]; then
            echo "USE_LORENZO=true" >> "$GITHUB_ENV"
          else
            echo "USE_LORENZO=false" >> "$GITHUB_ENV"
          fi

      - name: Set environment variables for iOS
        run: |
          if [[ "$USE_LORENZO" == "true" ]]; then
            echo "APPLE_ID=${{ secrets.LORENZO_APPLE_ID }}" >> "$GITHUB_ENV"
            echo "APPLE_ISSUER_ID=${{ secrets.LORENZO_APPLE_ISSUER_ID }}" >> "$GITHUB_ENV"
            echo "APPLE_KEY_ID=${{ secrets.LORENZO_APPLE_KEY_ID }}" >> "$GITHUB_ENV"
            echo "APPLE_TEAM_ID=${{ secrets.LORENZO_APPLE_TEAM_ID }}" >> "$GITHUB_ENV"
            echo "CERT_P12_BASE64=${{ secrets.LORENZO_CERT_P12_BASE64 }}" >> "$GITHUB_ENV"
            echo "CERT_P12_PASSWORD=${{ secrets.LORENZO_CERT_P12_PASSWORD }}" >> "$GITHUB_ENV"
          else
            echo "APPLE_ID=${{ secrets.APPLE_ID }}" >> "$GITHUB_ENV"
            echo "APPLE_ISSUER_ID=${{ secrets.APPLE_ISSUER_ID }}" >> "$GITHUB_ENV"
            echo "APPLE_KEY_ID=${{ secrets.APPLE_KEY_ID }}" >> "$GITHUB_ENV"
            echo "APPLE_TEAM_ID=${{ secrets.APPLE_TEAM_ID }}" >> "$GITHUB_ENV"
            echo "CERT_P12_BASE64=${{ secrets.CERT_P12_BASE64 }}" >> "$GITHUB_ENV"
            echo "CERT_P12_PASSWORD=${{ secrets.CERT_P12_PASSWORD }}" >> "$GITHUB_ENV"
          fi

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version-file: ".node-version"
          cache: "npm"

      - name: Setup EAS
        uses: expo/expo-github-action@v8
        with:
          eas-version: 16.20.0
          token: ${{ secrets.EXPO_TOKEN }}

      - name: Select Xcode version
        uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: 26.2

      - name: Install dependencies
        run: npm install

      - name: Install jq
        run: |
          if ! command -v jq >/dev/null 2>&1; then
            brew install jq
          fi

      - name: Install Fastlane on macOS
        run: |
          export GEM_HOME="$HOME/.gem"
          export PATH="$GEM_HOME/bin:$PATH"
          echo "GEM_HOME=$GEM_HOME" >> "$GITHUB_ENV"
          echo "$GEM_HOME/bin" >> "$GITHUB_PATH"
          gem install fastlane -NV

      - name: Extract app information
        run: |
          NAME=$(jq -r '.expo.name' app.json)
          BUNDLE_TARGET=$(echo "$NAME" | sed "s/’//g" | tr -d " .'&-")
          BUNDLE_ID=$(jq -r '.expo.ios.bundleIdentifier' app.json)
          EXTENSION_BUNDLE_ID="${BUNDLE_ID}.OneSignalNotificationServiceExtension"
          APP_VERSION=$(jq -r '.expo.version' app.json)
          APP_NAME=$(jq -r '.expo.name' app.json)

          if jq -e '
            (.expo.plugins // [])
            | map(if type == "array" then .[0] else . end)
            | index("onesignal-expo-plugin") != null
          ' app.json >/dev/null; then
            HAS_ONESIGNAL_EXTENSION=true
          else
            HAS_ONESIGNAL_EXTENSION=false
          fi

          echo "BUNDLE_TARGET=$BUNDLE_TARGET" >> "$GITHUB_ENV"
          echo "BUNDLE_ID=$BUNDLE_ID" >> "$GITHUB_ENV"
          echo "EXTENSION_BUNDLE_ID=$EXTENSION_BUNDLE_ID" >> "$GITHUB_ENV"
          echo "APP_VERSION=$APP_VERSION" >> "$GITHUB_ENV"
          echo "APP_NAME=$APP_NAME" >> "$GITHUB_ENV"
          echo "HAS_ONESIGNAL_EXTENSION=$HAS_ONESIGNAL_EXTENSION" >> "$GITHUB_ENV"

      - name: Determine if screenshots should be forced
        run: |
          if [[ "${{ github.event.inputs.forceScreenshots }}" == "true" || "$APP_VERSION" == "1.0.0" ]]; then
            echo "FORCE_SCREENSHOTS=true" >> "$GITHUB_ENV"
          else
            echo "FORCE_SCREENSHOTS=false" >> "$GITHUB_ENV"
          fi

      - name: Create Keychain
        run: |
          security create-keychain -p "${{ secrets.KEYCHAIN_PASSWORD }}" build.keychain
          security default-keychain -s build.keychain
          security unlock-keychain -p "${{ secrets.KEYCHAIN_PASSWORD }}" build.keychain
          security set-keychain-settings -t 3600 -u build.keychain

      - name: Decode certificate
        run: |
          echo "$CERT_P12_BASE64" | base64 --decode > certificate.p12
          security import certificate.p12 \
            -P "$CERT_P12_PASSWORD" \
            -A \
            -T /usr/bin/codesign \
            -T /usr/bin/security
          security set-key-partition-list \
            -S apple-tool:,apple: \
            -s \
            -k "${{ secrets.KEYCHAIN_PASSWORD }}" \
            build.keychain

      - name: Configure Fastlane API Key
        run: |
          if [[ "$USE_LORENZO" == "true" ]]; then
            echo "${{ secrets.LORENZO_APPLE_P8 }}" | base64 --decode > fastlane/AuthKey.p8
          else
            echo "${{ secrets.APPLE_P8 }}" | base64 --decode > fastlane/AuthKey.p8
          fi

          jq -n \
            --arg key_id "$APPLE_KEY_ID" \
            --arg issuer_id "$APPLE_ISSUER_ID" \
            --arg key "$(cat fastlane/AuthKey.p8)" \
            --argjson in_house false \
            '{key_id: $key_id, issuer_id: $issuer_id, key: $key, in_house: $in_house}' \
            > fastlane/api_key.json

      - name: Run Fastlane Create App
        env:
          AUTH_KEY_PATH: "fastlane/AuthKey.p8"
        run: fastlane create_app

      - name: Create credentials.json
        run: |
          if [[ ! -f "provisioning_profile.mobileprovision" ]]; then
            echo "Missing provisioning profile for the main iOS target."
            exit 1
          fi

          if [[ "$HAS_ONESIGNAL_EXTENSION" == "true" ]]; then
            if [[ ! -f "provisioning_profile_onesignal.mobileprovision" ]]; then
              echo "The app uses the OneSignal extension, but its provisioning profile is missing."
              exit 1
            fi

            jq -n \
              --arg target "$BUNDLE_TARGET" \
              --arg password "$CERT_P12_PASSWORD" \
              '{
                ios: {
                  "OneSignalNotificationServiceExtension": {
                    distributionCertificate: {
                      path: "certificate.p12",
                      password: $password
                    },
                    provisioningProfilePath: "provisioning_profile_onesignal.mobileprovision"
                  },
                  ($target): {
                    distributionCertificate: {
                      path: "certificate.p12",
                      password: $password
                    },
                    provisioningProfilePath: "provisioning_profile.mobileprovision"
                  }
                }
              }' > credentials.json
          else
            jq -n \
              --arg target "$BUNDLE_TARGET" \
              --arg password "$CERT_P12_PASSWORD" \
              '{
                ios: {
                  ($target): {
                    distributionCertificate: {
                      path: "certificate.p12",
                      password: $password
                    },
                    provisioningProfilePath: "provisioning_profile.mobileprovision"
                  }
                }
              }' > credentials.json
          fi

      - name: Build iOS
        env:
          EXPO_APPLE_TEAM_ID: ${{ env.APPLE_TEAM_ID }}
          EXPO_APPLE_KEY_ID: ${{ env.APPLE_KEY_ID }}
          EXPO_APPLE_ISSUER_ID: ${{ env.APPLE_ISSUER_ID }}
          EXPO_APPLE_API_KEY_PATH: "fastlane/AuthKey.p8"
        run: npm run build:ios

      - name: Prepare iOS artifact
        run: |
          IPA_PATH="$(find "$GITHUB_WORKSPACE" -type f -name '*.ipa' -print -quit)"

          if [[ -z "$IPA_PATH" ]]; then
            echo "No .ipa file found after the build."
            exit 1
          fi

          mkdir -p "$RUNNER_TEMP/ios-release"
          cp "$IPA_PATH" "$RUNNER_TEMP/ios-release/app.ipa"

          jq -n \
            --arg source_sha "$SOURCE_SHA" \
            --arg app_version "$APP_VERSION" \
            --arg force_screenshots "$FORCE_SCREENSHOTS" \
            --arg use_lorenzo "$USE_LORENZO" \
            '{
              source_sha: $source_sha,
              app_version: $app_version,
              force_screenshots: $force_screenshots,
              use_lorenzo: $use_lorenzo
            }' > "$RUNNER_TEMP/ios-release/release-context.json"

      - name: Store IPA on GitHub for 24 hours
        uses: actions/upload-artifact@v7
        with:
          name: ios-release-${{ github.run_id }}
          path: ${{ runner.temp }}/ios-release/
          retention-days: 1
          compression-level: 0
          if-no-files-found: error
          overwrite: true

  submit_ios:
    name: Submit iOS
    needs: build_ios
    runs-on: macos-latest

    steps:
      - name: Download previously built IPA
        uses: actions/download-artifact@v8
        with:
          name: ios-release-${{ github.run_id }}
          path: release-artifact

      - name: Install jq
        run: |
          if ! command -v jq >/dev/null 2>&1; then
            brew install jq
          fi

      - name: Load release context
        id: release_context
        run: |
          SOURCE_SHA=$(jq -r '.source_sha' release-artifact/release-context.json)
          FORCE_SCREENSHOTS=$(jq -r '.force_screenshots' release-artifact/release-context.json)
          USE_LORENZO=$(jq -r '.use_lorenzo' release-artifact/release-context.json)

          echo "source_sha=$SOURCE_SHA" >> "$GITHUB_OUTPUT"
          echo "SOURCE_SHA=$SOURCE_SHA" >> "$GITHUB_ENV"
          echo "FORCE_SCREENSHOTS=$FORCE_SCREENSHOTS" >> "$GITHUB_ENV"
          echo "USE_LORENZO=$USE_LORENZO" >> "$GITHUB_ENV"

          if [[ "$FORCE_SCREENSHOTS" == "true" ]]; then
            echo "SKIP_SCREENSHOTS=false" >> "$GITHUB_ENV"
          else
            echo "SKIP_SCREENSHOTS=true" >> "$GITHUB_ENV"
          fi

      - name: Checkout the exact source commit used for the build
        uses: actions/checkout@v6
        with:
          repository: Hantex9/easybook-app-refactor
          token: ${{ secrets.EASYBOOK_RELEASE_AUTOMATION_REPO_TOKEN }}
          ref: ${{ steps.release_context.outputs.source_sha }}
          path: source

      - name: Extract app information
        working-directory: source
        run: |
          APP_NAME=$(jq -r '.expo.name // empty' app.json)
          APP_VERSION=$(jq -r '.expo.version // empty' app.json)
          BUNDLE_ID=$(jq -r '.expo.ios.bundleIdentifier // empty' app.json)
          EXTENSION_BUNDLE_ID="${BUNDLE_ID}.OneSignalNotificationServiceExtension"

          if [[ -z "$APP_NAME" || -z "$APP_VERSION" || -z "$BUNDLE_ID" ]]; then
            echo "Missing APP_NAME, APP_VERSION or BUNDLE_ID in source/app.json"
            exit 1
          fi

          echo "APP_NAME=$APP_NAME" >> "$GITHUB_ENV"
          echo "APP_VERSION=$APP_VERSION" >> "$GITHUB_ENV"
          echo "BUNDLE_ID=$BUNDLE_ID" >> "$GITHUB_ENV"
          echo "EXTENSION_BUNDLE_ID=$EXTENSION_BUNDLE_ID" >> "$GITHUB_ENV"

      - name: Restore IPA into the project
        run: cp release-artifact/app.ipa source/app.ipa

      - name: Set Apple submission credentials
        run: |
          if [[ "$USE_LORENZO" == "true" ]]; then
            echo "APPLE_ISSUER_ID=${{ secrets.LORENZO_APPLE_ISSUER_ID }}" >> "$GITHUB_ENV"
            echo "APPLE_KEY_ID=${{ secrets.LORENZO_APPLE_KEY_ID }}" >> "$GITHUB_ENV"
          else
            echo "APPLE_ISSUER_ID=${{ secrets.APPLE_ISSUER_ID }}" >> "$GITHUB_ENV"
            echo "APPLE_KEY_ID=${{ secrets.APPLE_KEY_ID }}" >> "$GITHUB_ENV"
          fi

      - name: Install Fastlane
        run: |
          export GEM_HOME="$HOME/.gem"
          export PATH="$GEM_HOME/bin:$PATH"
          echo "GEM_HOME=$GEM_HOME" >> "$GITHUB_ENV"
          echo "$GEM_HOME/bin" >> "$GITHUB_PATH"
          gem install fastlane -NV

      - name: Configure App Store Connect API key
        working-directory: source
        run: |
          if [[ "$USE_LORENZO" == "true" ]]; then
            echo "${{ secrets.LORENZO_APPLE_P8 }}" | base64 --decode > fastlane/AuthKey.p8
          else
            echo "${{ secrets.APPLE_P8 }}" | base64 --decode > fastlane/AuthKey.p8
          fi

      - name: Upload to App Store
        working-directory: source
        env:
          AUTH_KEY_PATH: "fastlane/AuthKey.p8"
        run: fastlane upload_ipa_to_app_store

  build_android:
    name: Build Android
    runs-on: ubuntu-latest

    steps:
      - name: Delete unnecessary tools
        uses: jlumbroso/free-disk-space@v1.3.1
        with:
          android: false
          tool-cache: true
          dotnet: true
          haskell: true
          swap-storage: true
          docker-images: false
          large-packages: false

      - name: Checkout the Private Repository
        uses: actions/checkout@v6
        with:
          repository: Hantex9/easybook-app-refactor
          token: ${{ secrets.EASYBOOK_RELEASE_AUTOMATION_REPO_TOKEN }}
          ref: ${{ github.event.inputs.branch }}

      - name: Save source commit
        run: echo "SOURCE_SHA=$(git rev-parse HEAD)" >> "$GITHUB_ENV"

      - name: Check if lorenzo.txt exists
        run: |
          if [ -f "lorenzo.txt" ]; then
            echo "USE_LORENZO=true" >> "$GITHUB_ENV"
          else
            echo "USE_LORENZO=false" >> "$GITHUB_ENV"
          fi

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version-file: ".node-version"
          cache: "npm"

      - name: Setup EAS
        uses: expo/expo-github-action@v8
        with:
          eas-version: 16.20.0
          token: ${{ secrets.EXPO_TOKEN }}

      - name: Extract app information
        run: |
          APP_NAME=$(jq -r '.expo.name // empty' app.json)
          ANDROID_PACKAGE=$(jq -r '.expo.android.package // empty' app.json)
          APP_VERSION=$(jq -r '.expo.version // empty' app.json)

          if [[ -z "$APP_NAME" || -z "$ANDROID_PACKAGE" || -z "$APP_VERSION" ]]; then
            echo "Missing APP_NAME, ANDROID_PACKAGE or APP_VERSION in app.json"
            exit 1
          fi

          echo "APP_NAME=$APP_NAME" >> "$GITHUB_ENV"
          echo "ANDROID_PACKAGE=$ANDROID_PACKAGE" >> "$GITHUB_ENV"
          echo "APP_VERSION=$APP_VERSION" >> "$GITHUB_ENV"

      - name: Determine if screenshots should be forced
        run: |
          if [[ "${{ github.event.inputs.forceScreenshots }}" == "true" || "$APP_VERSION" == "1.0.0" ]]; then
            echo "FORCE_SCREENSHOTS=true" >> "$GITHUB_ENV"
          else
            echo "FORCE_SCREENSHOTS=false" >> "$GITHUB_ENV"
          fi

      - name: Set up Java 17
        uses: actions/setup-java@v5
        with:
          java-version: "17"
          distribution: "temurin"

      - name: Install dependencies
        run: npm install

      - name: Build Android
        run: npm run build:android

      - name: Prepare Android artifact
        run: |
          AAB_PATH="$(find "$GITHUB_WORKSPACE" -type f -name '*.aab' -print -quit)"

          if [[ -z "$AAB_PATH" ]]; then
            echo "No .aab file found after the build."
            exit 1
          fi

          mkdir -p "$RUNNER_TEMP/android-release"
          cp "$AAB_PATH" "$RUNNER_TEMP/android-release/app.aab"

          jq -n \
            --arg source_sha "$SOURCE_SHA" \
            --arg app_name "$APP_NAME" \
            --arg app_version "$APP_VERSION" \
            --arg force_screenshots "$FORCE_SCREENSHOTS" \
            --arg use_lorenzo "$USE_LORENZO" \
            --arg android_package "$ANDROID_PACKAGE" \
            '{
              source_sha: $source_sha,
              app_name: $app_name,
              app_version: $app_version,
              force_screenshots: $force_screenshots,
              use_lorenzo: $use_lorenzo,
              android_package: $android_package
            }' > "$RUNNER_TEMP/android-release/release-context.json"

      - name: Store AAB on GitHub for 24 hours
        uses: actions/upload-artifact@v7
        with:
          name: android-release-${{ github.run_id }}
          path: ${{ runner.temp }}/android-release/
          retention-days: 1
          compression-level: 0
          if-no-files-found: error
          overwrite: true

  submit_android:
    name: Submit Android
    needs: build_android
    runs-on: ubuntu-latest

    steps:
      - name: Download previously built AAB
        uses: actions/download-artifact@v8
        with:
          name: android-release-${{ github.run_id }}
          path: release-artifact

      - name: Load release context
        id: release_context
        run: |
          python3 - <<'PY'
          import json
          import os

          with open("release-artifact/release-context.json", encoding="utf-8") as file:
              context = json.load(file)

          values = {
              "SOURCE_SHA": context["source_sha"],
              "APP_NAME": context.get("app_name", ""),
              "APP_VERSION": context["app_version"],
              "FORCE_SCREENSHOTS": context["force_screenshots"],
              "USE_LORENZO": context["use_lorenzo"],
              "ANDROID_PACKAGE": context["android_package"],
              "SKIP_SCREENSHOTS": (
                  "false" if context["force_screenshots"] == "true" else "true"
              ),
          }

          with open(os.environ["GITHUB_ENV"], "a", encoding="utf-8") as env_file:
              for key, value in values.items():
                  env_file.write(f"{key}={value}\n")

          with open(os.environ["GITHUB_OUTPUT"], "a", encoding="utf-8") as output_file:
              output_file.write(f"source_sha={context['source_sha']}\n")
              output_file.write(f"app_version={context['app_version']}\n")
          PY

      - name: Checkout the exact source commit used for the build
        uses: actions/checkout@v6
        with:
          repository: Hantex9/easybook-app-refactor
          token: ${{ secrets.EASYBOOK_RELEASE_AUTOMATION_REPO_TOKEN }}
          ref: ${{ steps.release_context.outputs.source_sha }}
          path: source

      - name: Extract app information
        working-directory: source
        run: |
          APP_NAME=$(jq -r '.expo.name // empty' app.json)
          APP_VERSION=$(jq -r '.expo.version // empty' app.json)
          ANDROID_PACKAGE=$(jq -r '.expo.android.package // empty' app.json)

          if [[ -z "$APP_NAME" || -z "$APP_VERSION" || -z "$ANDROID_PACKAGE" ]]; then
            echo "Missing APP_NAME, APP_VERSION or ANDROID_PACKAGE in source/app.json"
            exit 1
          fi

          echo "APP_NAME=$APP_NAME" >> "$GITHUB_ENV"
          echo "APP_VERSION=$APP_VERSION" >> "$GITHUB_ENV"
          echo "ANDROID_PACKAGE=$ANDROID_PACKAGE" >> "$GITHUB_ENV"
          echo "APP_PACKAGE_NAME=$ANDROID_PACKAGE" >> "$GITHUB_ENV"
          echo "ANDROID_PACKAGE_NAME=$ANDROID_PACKAGE" >> "$GITHUB_ENV"

      - name: Restore AAB into the project
        run: cp release-artifact/app.aab source/app.aab

      - name: Set Google Play credentials
        run: |
          if [[ "$USE_LORENZO" == "true" ]]; then
            echo "GOOGLE_PLAY_EMAIL=${{ secrets.LORENZO_GOOGLE_PLAY_EMAIL }}" >> "$GITHUB_ENV"
            echo "GOOGLE_PLAY_PASSWORD=${{ secrets.LORENZO_GOOGLE_PLAY_PASSWORD }}" >> "$GITHUB_ENV"
            echo "GOOGLE_PLAY_JSON_KEY_BASE64=${{ secrets.LORENZO_GOOGLE_PLAY_JSON_KEY_BASE64 }}" >> "$GITHUB_ENV"
          else
            echo "GOOGLE_PLAY_EMAIL=${{ secrets.GOOGLE_PLAY_EMAIL }}" >> "$GITHUB_ENV"
            echo "GOOGLE_PLAY_PASSWORD=${{ secrets.GOOGLE_PLAY_PASSWORD }}" >> "$GITHUB_ENV"
            echo "GOOGLE_PLAY_JSON_KEY_BASE64=${{ secrets.GOOGLE_PLAY_JSON_KEY_BASE64 }}" >> "$GITHUB_ENV"
          fi

      - name: Install Ruby and Fastlane
        if: steps.release_context.outputs.app_version != '1.0.0'
        run: |
          sudo apt-get update
          sudo apt-get install -y ruby-full
          echo "GEM_HOME=$HOME/.gem" >> "$GITHUB_ENV"
          echo "$HOME/.gem/bin" >> "$GITHUB_PATH"
          gem install --user-install fastlane -NV

      - name: Decode Google Play JSON key
        if: steps.release_context.outputs.app_version != '1.0.0'
        working-directory: source
        run: |
          echo "$GOOGLE_PLAY_JSON_KEY_BASE64" \
            | base64 --decode \
            > google_play_json_key.json

      - name: Upload the update to the Play Store
        if: steps.release_context.outputs.app_version != '1.0.0'
        working-directory: source
        env:
          GOOGLE_PLAY_JSON_KEY: google_play_json_key.json
        run: fastlane upload_aab_to_play_store

      - name: Set up Node.js for first Play Store creation
        if: steps.release_context.outputs.app_version == '1.0.0'
        uses: actions/setup-node@v6
        with:
          node-version-file: "source/.node-version"

      - name: Checkout Easybook Automation Repository
        if: steps.release_context.outputs.app_version == '1.0.0'
        uses: actions/checkout@v6
        with:
          repository: Hantex9/easybook-release-automation-android
          token: ${{ secrets.EASYBOOK_RELEASE_AUTOMATION_REPO_TOKEN }}
          path: source/easybook-release-automation-android

      - name: Install Easybook release automation dependencies
        if: steps.release_context.outputs.app_version == '1.0.0'
        run: npm install
        working-directory: source/easybook-release-automation-android

      - name: Verify Easybook Automation environment
        if: steps.release_context.outputs.app_version == '1.0.0'
        run: |
          : "${APP_NAME:?APP_NAME environment variable is required}"
          : "${APP_VERSION:?APP_VERSION environment variable is required}"
          : "${APP_PACKAGE_NAME:?APP_PACKAGE_NAME environment variable is required}"
          : "${ANDROID_PACKAGE_NAME:?ANDROID_PACKAGE_NAME environment variable is required}"
          : "${GOOGLE_PLAY_EMAIL:?GOOGLE_PLAY_EMAIL environment variable is required}"
          : "${GOOGLE_PLAY_PASSWORD:?GOOGLE_PLAY_PASSWORD environment variable is required}"

          echo "App name: $APP_NAME"
          echo "App version: $APP_VERSION"
          echo "Package: $APP_PACKAGE_NAME"

      - name: Create the app on the Play Store with Easybook Automation
        if: steps.release_context.outputs.app_version == '1.0.0'
        run: npm run start
        working-directory: source/easybook-release-automation-android
